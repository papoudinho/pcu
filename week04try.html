<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Pong 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: #f5f5f5;
        }

        canvas {
            border: 2px solid black;
            background: #111;
        }
    </style>
</head>

<body>

    <h1>Pong 게임</h1>
    <p>왼쪽 플레이어: W / S | 오른쪽 플레이어: ↑ / ↓</p>
    <p>왼쪽 점수: <span id="leftScore">0</span> | 오른쪽 점수: <span id="rightScore">0</span></p>
    <p id="message"> 먼저 10점을 얻는 플레이어가 승리합니다!</p>

    <canvas id="gameCanvas" width="700" height="400"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const leftScoreText = document.getElementById("leftScore");
    const rightScoreText = document.getElementById("rightScore");

    let leftScore = 0;
    let rightScore = 0;

    const messageText = document.getElementById("message");

    const WINNING_SCORE = 10;
    let gameOver = false;

    function drawCenterline() {
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.strokeStyle = "white";
        ctx.stroke();
        ctx.setLineDash([]);
    }

    const ball = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 10, // raduis -> radius 수정
        dx: 5,
        dy: 3,
    };

    function drawBall() {
        ctx.beginPath();
        ctx.arc(
            ball.x,
            ball.y,
            ball.radius,
            0,
            Math.PI * 2);
        ctx.fillStyle = "yellow";
        ctx.fill();    
    }
    
    function moveBall() {
        ball.x += ball.dx;
        ball.y += ball.dy;

        if (ball.y - ball.radius < 0 || 
           ball.y + ball.radius > canvas.height 
        ) {
            ball.dy *= -1;
        }

        // 왼쪽 벽에 닿음 -> 오른쪽 플레이어 득점
        if (ball.x - ball.radius < 0) {
            rightScore++;
            rightScoreText.textContent = rightScore;

            if (rightScore >= WINNING_SCORE) {
                endGame("오른쪽 플레이어 승리! ");
            } else {
               resetBall(); 
            }
            return;
        }

        // 오른쪽 벽에 닿음 -> 왼쪽 플레이어 득점
        if (ball.x + ball.radius > canvas.width) {
            leftScore++;
            leftScoreText.textContent = leftScore;
            
            // rightScore가 아니라 leftScore를 체크해야 함
            if (leftScore >= WINNING_SCORE) {
                endGame("왼쪽 플레이어 승리! ");
            } else {
               resetBall(); 
            }
            return;
        }

        if (ball.dx < 0 && isBallHitPaddle(leftPaddle)) {
            ball.x = leftPaddle.x + leftPaddle.width + ball.radius;

            ball.dx = Math.min(Math.abs(ball.dx) + 0.4, 12);
            ball.dy = Math.sign(ball.dy) *
            Math.min(Math.abs(ball.dy) + 0.2, 10);
        }

        if (ball.dx > 0 && isBallHitPaddle(rightPaddle)) {
            ball.x = rightPaddle.x - ball.radius;

            ball.dx = -Math.min(Math.abs(ball.dx) + 0.4, 12);
            ball.dy = Math.sign(ball.dy) *
            Math.min(Math.abs(ball.dy) + 0.2, 10);
        }
    } 
    
    function isBallHitPaddle(paddle) {
        return (
            ball.x - ball.radius < paddle.x + paddle.width &&
            ball.x + ball.radius > paddle.x &&
            ball.y - ball.radius < paddle.y + paddle.height &&
            ball.y + ball.radius > paddle.y
        );
    }

    const keys = {};

    document.addEventListener("keydown", function (event){
        keys[event.key] = true;
        if (event.code === "Space" && gameOver){
            resetGame();
        }
    });
    
    document.addEventListener("keyup", function(event){
        keys[event.key] = false;
    });

    function movePaddles() {
        if (keys["w"] || keys["W"]) {
            leftPaddle.y -= leftPaddle.speed;
        }
        if (keys["s"] || keys["S"]) {
            leftPaddle.y += leftPaddle.speed;
        }
        if (keys["ArrowUp"]) {
            rightPaddle.y -= rightPaddle.speed;
        }
        if (keys["ArrowDown"]) {
          rightPaddle.y += rightPaddle.speed;  
        }
        keepPaddleInside(leftPaddle);
        keepPaddleInside(rightPaddle);
    }

    function keepPaddleInside(paddle){
        if (paddle.y < 0) {
            paddle.y = 0;
        }
        if (paddle.y + paddle.height > canvas.height){
            paddle.y = canvas.height - paddle.height;
        }
    }

    function resetBall() {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.dx *= -1;
        ball.dy = Math.random() * 6 - 3;
        if (ball.dy === 0) {
           ball.dy = 2; 
        }
    } 

    function endGame(winner) {
        gameOver = true;
        messageText.textContent = winner + "스페이스바를 누르면 다시 시작합니다.";
        messageText.style.color = "red";
    }

    function resetGame() {
        leftScore = 0;
        rightScore = 0;

        leftScoreText.textContent = leftScore;
        rightScoreText.textContent = rightScore; // rightScoreText로 수정

        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.dx = 5;
        ball.dy = 3;

        leftPaddle.y = canvas.height / 2 - leftPaddle.height / 2;
        rightPaddle.y = canvas.height / 2 - rightPaddle.height / 2;

        gameOver = false;
        messageText.textContent = "먼저 10점을 얻는 플레이어가 승리합니다!";
        messageText.style.color = "black";
    }

    const paddleWidth = 12;
    const paddleHeight = 80;

    const leftPaddle = {
        x: 30,
        y: canvas.height / 2 - paddleHeight / 2,
        width: paddleWidth,
        height: paddleHeight,
        speed: 6,
        color: "tomato"
    };

    const rightPaddle = {
        x: canvas.width - 30 - paddleWidth,
        y: canvas.height / 2 - paddleHeight / 2,
        width: paddleWidth,
        height: paddleHeight,
        speed: 6,
        color: "deepskyblue"
    };

    function drawrect(rect) {
        ctx.fillStyle = rect.color;
        ctx.fillRect(
            rect.x,
            rect.y,
            rect.width,
            rect.height
        );
    }

    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawCenterline();

        if (!gameOver) {
            moveBall();
            movePaddles();
        }

        drawBall();
        drawrect(leftPaddle);
        drawrect(rightPaddle);

        requestAnimationFrame(drawGame);
    }
    
    drawGame();
</script>
</body>

</html>
