<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Une surprise pour Chelsea 💕</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      padding: 25px 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffe4ee, #ffd1e2);
      color: #822447;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 460px);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .card {
      background: #fff8fb;
      padding: 28px 22px;
      border-radius: 28px;
      box-shadow: 0 15px 50px #a52a5520;
      animation: appear .5s ease;
    }

    .emoji { font-size: 65px; }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1.2;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
    }

    img {
      display: block;
      width: 100%;
      height: 340px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .placeholder {
      height: 280px;
      display: grid;
      place-items: center;
      border: 2px dashed #e49bb5;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
      font-size: 18px;
    }

    button {
      background: #c02660;
      color: white;
      border: none;
      padding: 16px 25px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #a61a50; }
    button:focus-visible {
      outline: 3px solid #822447;
      outline-offset: 4px;
    }

    .progress {
      margin-top: 20px;
      font-size: 14px;
    }

    .heart {
      position: fixed;
      top: -50px;
      pointer-events: none;
      z-index: 2;
      animation: fall 5s linear forwards;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fall {
      to { transform: translateY(115vh) rotate(300deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .heart { display: none; }
    }
  </style>
</head>

<body>
  <main>
    <div id="content" aria-live="polite"></div>
    <p id="progress" class="progress"></p>
  </main>

  <script>
    const steps = [
      {
        photo: "img/sourire.png",
        title: "Ce sourire, tu le reconnais ? ☀️",
        text: "Toujours souriante, toujours avec la bonne vibe. Avec elle, la bonne humeur est au rendez-vous. Vv qu'on ne manque pas de bêtises avec elle ! 😂"
      },
      {
        photo: "img/deuxdoigts.png",
        title: "La MANGOMB'S ✌️",
        text: "C'est une fille tellement jolie et je remercie ses parents pour sa venue sur terre, vraiment ! Si ils ne l'avaient pas fait, je l'aurais fait moi-même juste pour cette bonne vibe qu'elle apporte, tue çaaaaaaaa ! 🔥"
      },
      {
        photo: "img/noir.png",
        title: "La Choyeuse 💃🤣",
        text: "Elle est souvent dans des positions qu'elle seule comprend, mais bon, c'est notre bonne petite, on va encore faire comment, on reste avec elle ! 😭❤️"
      },
      {
        photo: "img/petite.png",
        title: "Mais surtout… un grand cœur 💛",
        text: "Derrière les blagues et les pas de danse, il y a une fille adorable avec un immense cœur depuis son plus jeune âge."
      }
    ];

    let current = -1;
    const content = document.getElementById("content");
    const progress = document.getElementById("progress");

    function show() {
      if (current === -1) {
        content.innerHTML = `
          <section class="card">
            <div class="emoji">🎁</div>
            <h1>C’est l’anniversaire de qui ? 👀</h1>
            <p>J’ai quelques indices pour toi…</p>
            <button id="next">On découvre ? 💕</button>
          </section>`;
        progress.textContent = "";
      } else if (current < steps.length) {
        const step = steps[current];

        content.innerHTML = `
          <section class="card">
            <img id="photo" alt="Chelsea">
            <h1>${step.title}</h1>
            <p>${step.text}</p>
            <button id="next">${
              current === steps.length - 1
                ? "La dernière surprise 🎁"
                : "La suite 🤭"
            }</button>
          </section>`;

        const photo = document.getElementById("photo");

        photo.onerror = () => {
          const placeholder = document.createElement("div");
          placeholder.className = "placeholder";
          placeholder.textContent = "📸 Ajoute ta photo : " + step.photo;
          photo.replaceWith(placeholder);
        };

        photo.src = step.photo;
        progress.textContent = `Indice ${current + 1} sur ${steps.length}`;
      } else {
        content.innerHTML = `
          <section class="card">
            <div class="emoji">🎂💕</div>
            <h1>Joyeux anniversaire Chelsea 💕🎂</h1>
            <p>
              Ma petite sœur d’amour, garde ton sourire,
              ta bonne humeur et ton grand cœur.
              Je te souhaite plein de bonheur, d’amour
              et de beaux moments.
            </p>
            <p>
              Continue de danser, même si on doit encore
              supporter tes pas 🤣❤️
              Je t’aime très fort !
            </p>
            <button id="again">Encore des cœurs 💖</button>
          </section>`;

        progress.textContent = "Avec tout l’amour de ton grand frère DAVID-SAMUEL ❤️";
        document.getElementById("again").onclick = rain;
        rain();
      }

      const next = document.getElementById("next");
      if (next) {
        next.onclick = () => {
          current++;
          show();
          window.scrollTo({ top: 0, behavior: "instant" });
        };
      }
    }

    let lastRain = 0;

    function rain() {
      if (Date.now() - lastRain < 800) return;
      lastRain = Date.now();

      for (let i = 0; i < 35; i++) {
        const heart = document.createElement("span");
        heart.className = "heart";
        heart.setAttribute("aria-hidden", "true");
        heart.textContent = ["💖", "💕", "💗", "❤️", "✨"][
          Math.floor(Math.random() * 5)
        ];
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = 20 + Math.random() * 20 + "px";
        heart.style.animationDelay = Math.random() + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6500);
      }
    }

    show();
  </script>
</body>
</html>
