<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>장애물 피하기 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: #f9f9f9;
        }

        #message {
            height: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>장애물 피하기 게임</h1>

    <p>
        점수: <span id="score">0</span> |
        체력: <span id="hp">100</span> |
        레벨: <span id="level">1</span>
    </p>

    <p>조작: 방향키 ↑ ↓ ← →</p>
    <p id="message">장애물을 피하세요!</p>

    <canvas
        id="gameCanvas"
        width="600"
        height="400">
    </canvas>

<script>
    const canvas =
        document.getElementById("gameCanvas");

    const ctx =
        canvas.getContext("2d");

    const scoreText =
        document.getElementById("score");

    const hpText =
        document.getElementById("hp");

    const levelText =
        document.getElementById("level");

    const messageText =
        document.getElementById("message");

    let score = 0;
    let hp = 100;
    let level = 1;
    let gameOver = false;

    let animationId;
    let rockTimerId;
    let messageTimerId;

    const player = {
        x: 280,
        y: 330,
        width: 40,
        height: 40,
        speed: 6
    };

    function drawPlayer() {
        const centerX =
            player.x + player.width / 2;

        // Corps du vaisseau
        ctx.fillStyle = "royalblue";

        ctx.beginPath();

        ctx.moveTo(
            centerX,
            player.y
        );

        ctx.lineTo(
            player.x + player.width,
            player.y + player.height
        );

        ctx.lineTo(
            player.x,
            player.y + player.height
        );

        ctx.closePath();
        ctx.fill();

        // Fenêtre du vaisseau
        ctx.fillStyle = "lightblue";

        ctx.beginPath();

        ctx.arc(
            centerX,
            player.y + 19,
            6,
            0,
            Math.PI * 2
        );

        ctx.fill();

        // Réacteurs
        ctx.fillStyle = "orange";

        ctx.fillRect(
            player.x + 8,
            player.y + player.height,
            7,
            7
        );

        ctx.fillRect(
            player.x + 25,
            player.y + player.height,
            7,
            7
        );
    }

    const keys = {};

    document.addEventListener(
        "keydown",
        function (event) {
            keys[event.key] = true;

            if ([
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                "Space"
            ].includes(event.code)) {
                event.preventDefault();
            }

            if (
                event.code === "Space" &&
                gameOver &&
                !event.repeat
            ) {
                restartGame();
            }
        }
    );

    document.addEventListener(
        "keyup",
        function (event) {
            keys[event.key] = false;
        }
    );

    function movePlayer() {
        if (keys["ArrowLeft"]) {
            player.x -= player.speed;
        }

        if (keys["ArrowRight"]) {
            player.x += player.speed;
        }

        if (keys["ArrowUp"]) {
            player.y -= player.speed;
        }

        if (keys["ArrowDown"]) {
            player.y += player.speed;
        }

        if (player.x < 0) {
            player.x = 0;
        }

        if (
            player.x + player.width >
            canvas.width
        ) {
            player.x =
                canvas.width - player.width;
        }

        if (player.y < 0) {
            player.y = 0;
        }

        if (
            player.y + player.height + 7 >
            canvas.height
        ) {
            player.y =
                canvas.height -
                player.height -
                7;
        }
    }

    const rocks = [];

    function createRock() {
        if (gameOver) {
            return;
        }

        const rock = {
            x:
                Math.random() *
                (canvas.width - 30),

            y: -30,

            width: 30,
            height: 30,

            speed:
                Math.random() * 3 +
                2 +
                (level - 1) * 0.5,

            damage: 20
        };

        rocks.push(rock);

        scheduleNextRock();
    }

    function getRockDelay() {
        return Math.max(
            250,
            700 - (level - 1) * 60
        );
    }

    function scheduleNextRock() {
        clearTimeout(rockTimerId);

        if (!gameOver) {
            rockTimerId = setTimeout(
                createRock,
                getRockDelay()
            );
        }
    }

    function drawRocks() {
        ctx.fillStyle = "gray";

        for (let rock of rocks) {
            ctx.beginPath();

            ctx.arc(
                rock.x + rock.width / 2,
                rock.y + rock.height / 2,
                rock.width / 2,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }

    function moveRocks() {
        for (let rock of rocks) {
            rock.y += rock.speed;
        }

        for (
            let i = rocks.length - 1;
            i >= 0;
            i--
        ) {
            if (
                rocks[i].y >
                canvas.height
            ) {
                rocks.splice(i, 1);

                score++;

                scoreText.textContent =
                    score;

                updateLevel();
            }
        }
    }

    function updateLevel() {
        const newLevel =
            Math.floor(score / 10) + 1;

        if (newLevel !== level) {
            level = newLevel;

            levelText.textContent =
                level;

            showMessage(
                "레벨 " +
                level +
                "! 장애물이 빨라집니다.",
                "royalblue"
            );

            scheduleNextRock();
        }
    }

    function checkCollision() {
        for (
            let i = rocks.length - 1;
            i >= 0;
            i--
        ) {
            const rock = rocks[i];

            if (
                player.x <
                    rock.x + rock.width &&

                player.x + player.width >
                    rock.x &&

                player.y <
                    rock.y + rock.height &&

                player.y + player.height >
                    rock.y
            ) {
                hp -= rock.damage;

                if (hp < 0) {
                    hp = 0;
                }

                hpText.textContent = hp;

                rocks.splice(i, 1);

                if (hp <= 0) {
                    endGame();
                    return;
                }
            }
        }
    }

    function drawHpBar() {
        // Fond de la barre
        ctx.fillStyle = "lightgray";

        ctx.fillRect(
            20,
            20,
            200,
            20
        );

        // Couleur dynamique
        if (hp > 60) {
            ctx.fillStyle = "limegreen";
        } else if (hp > 30) {
            ctx.fillStyle = "orange";
        } else {
            ctx.fillStyle = "red";
        }

        // Quantité de vie restante
        ctx.fillRect(
            20,
            20,
            hp * 2,
            20
        );

        // Bordure
        ctx.strokeStyle = "black";

        ctx.strokeRect(
            20,
            20,
            200,
            20
        );
    }

    function showMessage(
        text,
        color
    ) {
        clearTimeout(messageTimerId);

        messageText.textContent = text;
        messageText.style.color = color;

        messageTimerId =
            setTimeout(function () {
                if (!gameOver) {
                    messageText.textContent =
                        "장애물을 피하세요!";

                    messageText.style.color =
                        "black";
                }
            }, 1500);
    }

    function endGame() {
        gameOver = true;

        clearTimeout(rockTimerId);

        messageText.textContent =
            "게임 오버! 스페이스바를 " +
            "누르면 다시 시작합니다.";

        messageText.style.color =
            "red";
    }

    function drawGameOver() {
        ctx.fillStyle =
            "rgba(0, 0, 0, 0.7)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.font = "32px Arial";
        ctx.fillStyle = "white";
        ctx.textAlign = "center";

        ctx.fillText(
            "게임 오버!",
            canvas.width / 2,
            canvas.height / 2 - 35
        );

        ctx.fillText(
            "최종 점수: " + score,
            canvas.width / 2,
            canvas.height / 2 + 10
        );

        ctx.font = "18px Arial";

        ctx.fillText(
            "스페이스바를 누르면 다시 시작합니다.",
            canvas.width / 2,
            canvas.height / 2 + 50
        );
    }

    function restartGame() {
        cancelAnimationFrame(animationId);
        clearTimeout(rockTimerId);
        clearTimeout(messageTimerId);

        score = 0;
        hp = 100;
        level = 1;
        gameOver = false;

        rocks.length = 0;

        player.x =
            canvas.width / 2 -
            player.width / 2;

        player.y =
            canvas.height - 70;

        scoreText.textContent =
            score;

        hpText.textContent =
            hp;

        levelText.textContent =
            level;

        messageText.textContent =
            "장애물을 피하세요!";

        messageText.style.color =
            "black";

        scheduleNextRock();
        gameLoop();
    }

    function gameLoop() {
        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        if (!gameOver) {
            movePlayer();
            moveRocks();
            checkCollision();
        }

        drawHpBar();
        drawPlayer();
        drawRocks();

        if (gameOver) {
            drawGameOver();
            return;
        }

        animationId =
            requestAnimationFrame(
                gameLoop
            );
    }

    scheduleNextRock();
    gameLoop();
</script>

</body>

</html>
