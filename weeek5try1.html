<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>벽돌깨기 게임 - 레이저 모드</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: #f9f9f9;
        }

        #message {
            height: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>벽돌깨기 게임</h1>

    <p>
        점수: <span id="score">0</span> |
        목숨: <span id="lives">3</span>
    </p>

    <p>조작: ← / → 방향키 | 일시정지: P | 레이저 발사: ⬆️ (위쪽 화살표)</p>
    <p id="message">황금 벽돌은 3점과 레이저 보을 줍니다!</p>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const livesText = document.getElementById("lives");
    const messageText = document.getElementById("message");

    let score = 0;
    let lives = 3;
    let destroyedBricks = 0;
    let isGameOver = false;
    let isPaused = false;
    let nextSpeedScore = 8;
    let lifeBonusGiven = false;
    let currentBallSpeed = 4;
    let paddleBonusTimer;
    let laserTimer;
    let messageTimer;

    const NORMAL_PADDLE_WIDTH = 100;
    const BONUS_PADDLE_WIDTH = 150;

    const paddle = {
        x: canvas.width / 2 - NORMAL_PADDLE_WIDTH / 2,
        y: canvas.height - 30,
        width: NORMAL_PADDLE_WIDTH,
        height: 12,
        speed: 7,
        hasLaser: false
    };

    const lasers = [];

    function drawPaddle() {
        ctx.fillStyle = paddle.hasLaser ? "#e74c3c" : "#333";
        ctx.fillRect(
            paddle.x,
            paddle.y,
            paddle.width,
            paddle.height
        );

        // Si le laser est actif, dessiner de petits canons sur la raquette
        if (paddle.hasLaser) {
            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(paddle.x + 10, paddle.y - 4, 6, 4);
            ctx.fillRect(paddle.x + paddle.width - 16, paddle.y - 4, 6, 4);
        }
    }

    const keys = {};

    document.addEventListener("keydown", function (event) {
        keys[event.key] = true;

        if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(event.code)) {
            event.preventDefault();
        }

        // Tirer un laser avec la flèche du haut
        if (event.code === "ArrowUp" && paddle.hasLaser && !isGameOver && !isPaused) {
            shootLaser();
        }

        if (
            !event.repeat &&
            event.key.toLowerCase() === "p" &&
            !isGameOver
        ) {
            isPaused = !isPaused;

            if (isPaused) {
                showMessage("일시정지", "#8e44ad", 0);
            } else {
                showMessage(
                    "게임을 다시 시작합니다!",
                    "#2c3e50",
                    1000
                );
            }
        }

        if (
            !event.repeat &&
            event.code === "Space" &&
            isGameOver
        ) {
            restartGame();
        }
    });

    document.addEventListener("keyup", function (event) {
        keys[event.key] = false;
    });

    function shootLaser() {
        // Ajouter deux rayons laser (gauche et droite de la raquette)
        lasers.push({ x: paddle.x + 12, y: paddle.y, width: 4, height: 12, speed: 8 });
        lasers.push({ x: paddle.x + paddle.width - 16, y: paddle.y, width: 4, height: 12, speed: 8 });
    }

    function updateLasers() {
        for (let i = lasers.length - 1; i >= 0; i--) {
            let l = lasers[i];
            l.y -= l.speed;

            // Supprimer le laser s'il sort de l'écran
            if (l.y < 0) {
                lasers.splice(i, 1);
                continue;
            }

            // Vérifier la collision du laser avec les briques
            for (let r = 0; r < brick.row; r++) {
                for (let c = 0; c < brick.column; c++) {
                    let b = bricks[r][c];
                    if (
                        b.visible &&
                        l.x < b.x + brick.width &&
                        l.x + l.width > b.x &&
                        l.y < b.y + brick.height &&
                        l.y + l.height > b.y
                    ) {
                        b.visible = false;
                        destroyedBricks++;
                        lasers.splice(i, 1); // Supprimer le laser

                        if (b.isGolden) {
                            score += 3;
                        } else {
                            score++;
                        }

                        scoreText.textContent = score;
                        checkSpeedBonus();
                        checkLifeBonus();

                        if (destroyedBricks === brick.row * brick.column) {
                            gameClear();
                        }
                        break;
                    }
                }
            }
        }
    }

    function drawLasers() {
        ctx.fillStyle = "#e74c3c";
        for (let l of lasers) {
            ctx.fillRect(l.x, l.y, l.width, l.height);
        }
    }

    function movePaddle() {
        if (keys["ArrowLeft"]) {
            paddle.x -= paddle.speed;
        }

        if (keys["ArrowRight"]) {
            paddle.x += paddle.speed;
        }

        keepPaddleInside();
    }

    function keepPaddleInside() {
        if (paddle.x < 0) {
            paddle.x = 0;
        }

        if (paddle.x + paddle.width > canvas.width) {
            paddle.x = canvas.width - paddle.width;
        }
    }

    const ball = {
        x: canvas.width / 2,
        y: canvas.height - 50,
        radius: 8,
        dx: 4,
        dy: -4
    };

    function drawBall() {
        ctx.beginPath();
        ctx.arc(
            ball.x,
            ball.y,
            ball.radius,
            0,
            Math.PI * 2
        );
        ctx.fillStyle = "tomato";
        ctx.fill();
    }

    function moveBall() {
        ball.x += ball.dx;
        ball.y += ball.dy;

        if (
            ball.x - ball.radius < 0 ||
            ball.x + ball.radius > canvas.width
        ) {
            ball.dx *= -1;
        }

        if (ball.y - ball.radius < 0) {
            ball.dy *= -1;
        }

        if (
            ball.x + ball.radius > paddle.x &&
            ball.x - ball.radius < paddle.x + paddle.width &&
            ball.y + ball.radius > paddle.y &&
            ball.y - ball.radius < paddle.y + paddle.height &&
            ball.dy > 0
        ) {
            ball.y = paddle.y - ball.radius;
            ball.dy = -Math.abs(ball.dy);
        }

        if (ball.y - ball.radius > canvas.height) {
            lives--;
            livesText.textContent = lives;

            if (lives <= 0) {
                gameOver();
            } else {
                showMessage(
                    "목숨을 잃었습니다!",
                    "#e74c3c",
                    1200
                );
                resetBallAndPaddle();
            }
        }
    }

    function resetBallAndPaddle() {
        paddle.x = canvas.width / 2 - paddle.width / 2;
        ball.x = canvas.width / 2;
        ball.y = canvas.height - 50;

        if (Math.random() < 0.5) {
            ball.dx = -currentBallSpeed;
        } else {
            ball.dx = currentBallSpeed;
        }

        ball.dy = -currentBallSpeed;
    }

    const brick = {
        row: 4,
        column: 8,
        width: 60,
        height: 20,
        padding: 10,
        offsetTop: 40,
        offsetLeft: 25
    };

    const brickColors = [
        "#e74c3c",
        "#f39c12",
        "#2ecc71",
        "#3498db"
    ];

    const bricks = [];

    for (let r = 0; r < brick.row; r++) {
        bricks[r] = [];

        for (let c = 0; c < brick.column; c++) {
            bricks[r][c] = {
                x: c * (brick.width + brick.padding) + brick.offsetLeft,
                y: r * (brick.height + brick.padding) + brick.offsetTop,
                visible: true,
                isGolden:
                    (r === 0 && c === 3) ||
                    (r === 2 && c === 1) ||
                    (r === 3 && c === 6)
            };
        }
    }

    function drawBricks() {
        for (let r = 0; r < brick.row; r++) {
            for (let c = 0; c < brick.column; c++) {
                const b = bricks[r][c];

                if (b.visible) {
                    if (b.isGolden) {
                        ctx.fillStyle = "gold";
                    } else {
                        ctx.fillStyle = brickColors[r];
                    }

                    ctx.fillRect(b.x, b.y, brick.width, brick.height);
                    ctx.strokeStyle = "white";
                    ctx.strokeRect(b.x, b.y, brick.width, brick.height);
                }
            }
        }
    }

    function checkBrickCollision() {
        for (let r = 0; r < brick.row; r++) {
            for (let c = 0; c < brick.column; c++) {
                const b = bricks[r][c];

                if (
                    b.visible &&
                    ball.x + ball.radius > b.x &&
                    ball.x - ball.radius < b.x + brick.width &&
                    ball.y + ball.radius > b.y &&
                    ball.y - ball.radius < b.y + brick.height
                ) {
                    ball.dy *= -1;
                    b.visible = false;
                    destroyedBricks++;

                    if (b.isGolden) {
                        score += 3;
                        activateBonuses();

                        showMessage(
                            "황금 벽돌! +3점 / 패들 확장 & 레이저 활성화!",
                            "#d4a017",
                            1800
                        );
                    } else {
                        score++;
                    }

                    scoreText.textContent = score;

                    checkSpeedBonus();
                    checkLifeBonus();

                    if (destroyedBricks === brick.row * brick.column) {
                        gameClear();
                    }

                    return;
                }
            }
        }
    }

    function checkSpeedBonus() {
        while (score >= nextSpeedScore) {
            currentBallSpeed = Math.min(currentBallSpeed + 0.5, 8);

            const directionX = ball.dx < 0 ? -1 : 1;
            const directionY = ball.dy < 0 ? -1 : 1;

            ball.dx = directionX * currentBallSpeed;
            ball.dy = directionY * currentBallSpeed;

            nextSpeedScore += 8;

            showMessage("공 속도가 증가했습니다!", "#8e44ad", 1200);
        }
    }

    function checkLifeBonus() {
        if (score >= 20 && !lifeBonusGiven) {
            lives++;
            livesText.textContent = lives;
            lifeBonusGiven = true;

            showMessage("보너스 목숨 +1!", "#27ae60", 1500);
        }
    }

    function activateBonuses() {
        clearTimeout(paddleBonusTimer);
        clearTimeout(laserTimer);

        paddle.width = BONUS_PADDLE_WIDTH;
        paddle.hasLaser = true;
        keepPaddleInside();

        // Les bonus durent 6 secondes
        paddleBonusTimer = setTimeout(function () {
            paddle.width = NORMAL_PADDLE_WIDTH;
            keepPaddleInside();
        }, 6000);

        laserTimer = setTimeout(function () {
            paddle.hasLaser = false;
        }, 6000);
    }

    function showMessage(text, color, duration) {
        clearTimeout(messageTimer);

        messageText.textContent = text;
        messageText.style.color = color;

        if (duration > 0) {
            messageTimer = setTimeout(function () {
                if (!isGameOver && !isPaused) {
                    messageText.textContent = "황금 벽돌은 3점과 레이저 보을 줍니다!";
                    messageText.style.color = "black";
                }
            }, duration);
        }
    }

    function gameOver() {
        isGameOver = true;
        showMessage("게임 오버! 스페이스바를 누르면 다시 시작합니다.", "#e74c3c", 0);
    }

    function gameClear() {
        isGameOver = true;
        showMessage("축하합니다! 모든 벽돌을 깼습니다. 스페이스바를 누르면 다시 시작합니다.", "#27ae60", 0);
    }

    function restartGame() {
        clearTimeout(paddleBonusTimer);
        clearTimeout(laserTimer);
        clearTimeout(messageTimer);

        score = 0;
        lives = 3;
        destroyedBricks = 0;
        nextSpeedScore = 8;
        lifeBonusGiven = false;
        currentBallSpeed = 4;
        isGameOver = false;
        isPaused = false;
        lasers.length = 0;

        scoreText.textContent = score;
        livesText.textContent = lives;

        paddle.width = NORMAL_PADDLE_WIDTH;
        paddle.hasLaser = false;

        for (let r = 0; r < brick.row; r++) {
            for (let c = 0; c < brick.column; c++) {
                bricks[r][c].visible = true;
            }
        }

        showMessage("새 게임을 시작합니다!", "#2c3e50", 1200);
        resetBallAndPaddle();
    }

    function drawGame() {
        if (!isGameOver && !isPaused) {
            movePaddle();
            moveBall();
            updateLasers();
            checkBrickCollision();
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawPaddle();
        drawBall();
        drawLasers();
        drawBricks();

        requestAnimationFrame(drawGame);
    }

    drawGame();
</script>

</body>
</html>
